<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library App</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="book-list" class="book-list">
      <table>
        <caption>
          My Library
        </caption>
        <thead>
          <tr>
            <th scope="col" class="table-text">Title</th>
            <th scope="col" class="table-text">Author</th>
            <th scope="col" class="col-num-pages">Num. pages</th>
            <th scope="col">Read</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="modal-container hidden" id="bookForm">
      <div class="modal">
        <button class="toggleModal closeModalButton removeButton">X</button>
        <form>
          <div>
            <label for="title">Title</label>
            <input type="text" id="title" required />
          </div>
          <div>
            <label for="author">Author</label>
            <input type="text" id="author" required />
          </div>
          <div>
            <label for="pages">Number of pages</label>
            <input type="number" id="pages" required />
          </div>
          <div>
            <p>Have you read the book?</p>
            <label>
              <input type="radio" name="choice" value="true" required />
              Yes
            </label>
            <label>
              <input type="radio" name="choice" value="false" required />
              No
            </label>
          </div>
          <button id="addBookButton" class="addButton">Add a new book</button>
        </form>
      </div>
    </div>
    <button class="addButton toggleModal">Add a book</button>
    <script src="script.js"></script>
  </body>
</html>
